apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aspire-dashboard
  template:
    metadata:
      labels:
        app: aspire-dashboard
    spec:
      containers:
        - name: aspire-dashboard
          image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DASHBOARD__OTLP__AUTHMODE
              value: Unsecured
            - name: DASHBOARD__FRONTEND__AUTHMODE
              value: Unsecured
          ports:
            - name: ui
              containerPort: 18888
            - name: otlp-grpc
              containerPort: 18889
